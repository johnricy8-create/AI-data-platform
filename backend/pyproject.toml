[project]
name = "ai-commerce-hub"
version = "0.1.0"
description = "AI 电商数据中台 MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "python-multipart>=0.0.20",
  "pandas>=2.2.0",
  "openpyxl>=3.1.5",
  "httpx>=0.28.0",
  "langgraph>=0.2.60",
  "json-repair>=0.64.2",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "pdfplumber>=0.11.10",
  "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "reportlab>=5.1.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
